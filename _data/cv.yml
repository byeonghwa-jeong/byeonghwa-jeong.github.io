        summary: "Develop geospatial AI methods for population and socioeconomic measurement, disaster impacts, and infrastructure risk."
        highlights:
          - "Develop geospatial AI methods for large-scale population modelling using graph neural networks, computer vision, satellite embeddings, and spatial machine learning."
          - "Develop a deep-learning framework using AlphaEarth satellite embeddings to reconstruct gridded population surfaces while explicitly modelling populated and zero-population areas and evaluating geographic transferability across Taiwan, Ecuador, the Democratic Republic of the Congo, and Japan."
          - "Train and evaluate PyTorch deep-learning and graph models on NVIDIA A100 and H200 GPU systems, focusing on scalable architectures, geographic transferability, and efficient modelling of large spatial datasets."
          - "Contribute to LandScan Global and LandScan Mosaic, including global gridded-population production, rapid population-impact estimation for disasters and conflicts, and development of population-model inputs."
          - "Lead or co-lead research on multi-scale population forecasting, satellite-based population reconstruction, building-level wealth estimation, and hurricane-induced power-outage forecasting."
          - "Submitted a $228,000 competitive ORNL seed proposal as Principal Investigator on graph-based outage and population-impact prediction."

